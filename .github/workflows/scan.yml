# Reads the portals and news four times a day, every day, rebuilds the site data and commits it.
# Cloudflare Pages redeploys on each commit. Times are UTC: 04:00, 07:00, 10:00, 13:00 = 09:00, 12:00, 15:00, 18:00 PKT.
name: scan
on:
  schedule:
    - cron: "0 4,7,10,13 * * *"
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: scan
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install
        run: pip install -r scraper/requirements.txt
      - name: Read sources
        run: python scraper/scan.py
      - name: Build data
        run: |
          python build/normalize.py
          python build/make_catalogue.py
      - name: AI reader (second reader for tenders and news)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scraper/ai_reader.py
      - name: Finish data
        run: |
          node build/make_data.js
          python build/make_standalone.py
      - name: Post new tenders to Teams
        env:
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
          SITE_URL: ${{ vars.SITE_URL }}
        run: python scraper/digest.py
      - name: Commit
        run: |
          git config user.name "jwod-scan"
          git config user.email "actions@users.noreply.github.com"
          git add raw archive app/data dist build/out
          git diff --cached --quiet || git commit -m "Scan $(date -u +'%Y-%m-%d %H:%M') UTC"
          git push
