# Reads the portals and news six times a day, every day, rebuilds the site data and commits it.
# Cloudflare Pages redeploys on each commit. Six slots a day, off the hour, because GitHub drops and delays
# scheduled runs that start on the hour. Times are UTC: 03:17 to 13:17 every two hours = 08:17 to 18:17 PKT.
# A missed slot is covered by the next one; each scan reads every open tender, so nothing is lost.
name: scan
on:
  schedule:
    - cron: "17 3,5,7,9,11,13 * * *"
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: scan
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install
        run: pip install -r scraper/requirements.txt
      - name: Read sources
        run: python scraper/scan.py
      - name: Build data
        run: |
          python build/normalize.py
          python build/make_catalogue.py
      - name: AI reader (second reader for tenders and news)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scraper/ai_reader.py
      - name: Finish data
        run: |
          node build/make_data.js
          node build/make_market_live.js
          python build/make_standalone.py
      - name: Post new tenders to Teams
        env:
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
          SITE_URL: ${{ vars.SITE_URL }}
        run: python scraper/digest.py
      - name: Commit
        run: |
          git config user.name "jwod-scan"
          git config user.email "actions@users.noreply.github.com"
          git add raw archive app/data dist build/out
          git diff --cached --quiet || git commit -m "Scan $(date -u +'%Y-%m-%d %H:%M') UTC"
          git pull --rebase origin main
          git push
